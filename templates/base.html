{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Система планирования маршрутов доставки{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'homepage/css/style.css' %}">
</head>
<body>
    {% include "includes/navigation.html" %}
    <main class="container py-4 py-md-5" id="main-content">
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer border-top py-4 mt-auto">
        <div class="container text-center text-muted small">
            Система планирования маршрутов доставки · Учебный проект
        </div>
    </footer>
    <button class="back-to-top" id="back-to-top" type="button"
            aria-label="Вернуться наверх" title="Вернуться наверх">↑</button>
    <script src="{% static 'homepage/js/main.js' %}" defer></script>
</body>
</html>
